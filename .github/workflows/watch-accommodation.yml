name: Watch Brutal Assault Accommodation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create or refresh the baseline without sending an alert
        required: false
        type: boolean
        default: false
      dry_run:
        description: Check for changes without sending Telegram or updating state
        required: false
        type: boolean
        default: false
      test_telegram:
        description: Send a Telegram test message and exit
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ba-accommodation-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=()

          if [ "${{ inputs.bootstrap || false }}" = "true" ]; then
            args+=(--bootstrap)
          fi

          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "${{ inputs.test_telegram || false }}" = "true" ]; then
            args+=(--test-telegram)
          fi

          node src/index.js "${args[@]}"

      - name: Commit updated state
        if: ${{ success() && inputs.dry_run != true && inputs.test_telegram != true }}
        run: |
          if git diff --quiet -- state/latest.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest.json
          git commit -m "chore: update BA watcher state"
          git push